# nginx config for the LCCB POS + storefront.
#
# Layout:
#   /            -> storefront (customer shop)
#   /pos/        -> staff POS single-page app
#   /api/        -> backend on port 5000
#   /uploads/    -> product images from the backend
#
# Replace the server_name and add TLS before using this in production; the
# commented block at the bottom shows the certificate path.

upstream lccb_api {
    server api:5000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/shop;
    index index.html;

    # Uploads can be large-ish product photos; receipts are blocked by the app.
    client_max_body_size 8m;

    # --- security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable.
    location ~* ^/assets/.*\.(js|css|woff2?|png|jpg|jpeg|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- API ---
    location /api/ {
        proxy_pass         http://lccb_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # --- product images (backend serves these; receipts are rejected there) ---
    location /uploads/ {
        proxy_pass         http://lccb_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- staff POS ---
    #
    # Uses `root`, not `alias`. With an alias, try_files resolves $uri against
    # the server-level root (.../html/shop), so every POS request would look in
    # the wrong directory and fall through to index.html, serving HTML where the
    # browser expected JavaScript. With `root /usr/share/nginx/html` the full $uri
    # (/pos/assets/x.js) maps straight onto the POS build directory.
    location /pos/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /pos/index.html;
    }

    # Hashed POS bundles are immutable, same as the storefront's.
    location ~* ^/pos/assets/.*\.(js|css|woff2?|png|jpg|jpeg|svg|webp)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- storefront SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles or backups.
    location ~ /\. {
        deny all;
    }
}

