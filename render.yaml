services:
  - type: web
    name: pos-bookstore-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_CLIENT
        value: postgres
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA_CERT
        sync: false
      - key: UPLOAD_STORAGE
        value: supabase
      - key: SUPABASE_PRODUCT_BUCKET
        value: product-images
      - key: SUPABASE_RECEIPT_BUCKET
        value: payment-receipts
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
