# Local/production stack: MySQL + API + nginx serving both frontends.
#
#   cp backend/.env.example backend/.env    # then fill it in
#   docker compose --env-file backend/.env up -d --build
#   docker compose --env-file backend/.env exec api node scripts/migrate.js
#
# The --env-file flag matters: Compose resolves ${DB_PASSWORD} and friends from
# its own env file, which defaults to a .env in THIS directory, not
# backend/.env. Without the flag the stack aborts with
# "required variable DB_PASSWORD is missing a value".
#
# The values below are container-to-container wiring. The real credentials are
# read from backend/.env.

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-pos_bookstore}
      MYSQL_USER: ${DB_USER:-pos_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in backend/.env and pass --env-file backend/.env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Not published: only the API needs to reach the database.

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "5000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-pos_bookstore}
      DB_USER: ${DB_USER:-pos_user}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in backend/.env and pass --env-file backend/.env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in backend/.env and pass --env-file backend/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      UPLOAD_DIR: /data/uploads
      # SMTP_* are optional; verification email is skipped when unset.
    volumes:
      # Product images and receipts must survive `docker compose down`.
      - uploads:/data/uploads
    expose:
      - "5000"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      # Present so the image build can be reproduced with the same CORS list.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}

volumes:
  db-data:
  uploads:
